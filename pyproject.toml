[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbo-compute-agent"
version = "0.1.0"
description = "Quality-aware multimodal compute routing agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
text = ["transformers>=4.40,<5", "torch>=2.2", "datasets>=2.19,<5"]

[tool.setuptools.packages.find]
include = ["nimbo*"]
