name: NIMBO judging checks

on:
  push:
    branches: [main, judging-submission-20261031]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python regression tests (no model download)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . 'pytest==9.0.2' 'fastapi==0.128.2' 'httpx==0.28.1'
      - name: Verify public evidence integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/judging/LATEST_HELDOUT_EVIDENCE.json')
          evidence=json.loads(p.read_text(encoding='utf8'))
          assert evidence['inputs']==800 and evidence['rounds']==3
          assert evidence['approval']=='eligible_for_review'
          assert evidence['baseline_accuracy']==evidence['candidate_accuracy']
          assert evidence['mean_latency_reduction_fraction']>0
          assert not evidence['exported_variant']
          print('Published summary fields are internally consistent; this is not a new benchmark run.')
          PY
      - name: Verify latest published dual-objective summary (no model download)
        run: python -m tools.verify_public_proof_v1
      - name: Verify cross-domain public summary (no model download)
        run: python -m tools.verify_cross_domain_public_v1
      - name: Run regression tests
        run: python -m pytest -q

  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
